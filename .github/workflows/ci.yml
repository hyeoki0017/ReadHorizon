name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 테스트 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt
      - name: 린트
        run: ruff check readhorizon tests
      - name: 테스트
        run: python -m pytest -q
      - name: 프런트엔드 문법 검사
        run: node --check readhorizon/static/app.js

  docker:
    name: Docker 이미지 빌드·실행 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 이미지 빌드
        run: docker build -t readhorizon:ci .
      - name: 컨테이너 실행 확인
        run: |
          docker run -d --name rh -p 8000:8000 readhorizon:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q ReadHorizon
          test "$(docker exec rh id -u)" = "10001"
      - name: 컨테이너 로그
        if: always()
        run: docker logs rh || true
