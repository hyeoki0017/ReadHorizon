[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readhorizon"
version = "0.1.0"
description = "근거 기반 텍스트 분석·독해 도우미 (문학 · 학습·연구 · 사용자 지정)"
readme = "README.md"
requires-python = ">=3.10"
# requirements.txt와 같은 하한(알려진 취약점이 없는 버전)
dependencies = [
    "anthropic>=1.8,<2",
    "fastapi>=0.141",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.35",
    "h11>=0.16",
    "python-multipart>=0.0.31",
    "pypdf>=6.16.1",
    "python-docx>=1.2",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
readhorizon = "readhorizon.cli:main"

[tool.setuptools.packages.find]
include = ["readhorizon*"]

[tool.setuptools.package-data]
readhorizon = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]
ignore = ["E501", "S101", "S311"]
